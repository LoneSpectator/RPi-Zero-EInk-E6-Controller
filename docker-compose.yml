services:
    photopainter:
        image: ${IMAGE:-ghcr.io/lonespectator/rpi-zero-eink-e6-controller:latest}
        restart: unless-stopped
        ports:
            - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
        environment:
            DISPLAY_DRIVER: waveshare
            TZ: ${TZ:-Asia/Shanghai}
            WEB_USERNAME: ${WEB_USERNAME:-admin}
            WEB_PASSWORD: ${WEB_PASSWORD:-}
            INA219_ADDRESS: ${INA219_ADDRESS:-0x43}
            I2C_BUS: "1"
            GPIO_CHIP: "0"
        devices:
            - /dev/spidev0.0:/dev/spidev0.0
            - /dev/gpiochip0:/dev/gpiochip0
            - /dev/i2c-1:/dev/i2c-1
        volumes:
            - ./data:/data
        stop_grace_period: 5m
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
